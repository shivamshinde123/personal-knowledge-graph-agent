# Non-secret configuration for the Personal Knowledge Graph Agent.
# Secrets live in config/.env (gitignored) — see config/.env.example.
# Reference: docs/Environment_Config_Reference.docx section 4.

llm:
  provider_mode: fully_cloud # fully_local | fully_cloud -- controls generation only; embedding is always cloud, see below
  local_generation_model: llama3:8b # used when provider_mode is fully_local
  cloud_generation_model: anthropic/claude-sonnet-4 # used when provider_mode is fully_cloud
  cloud_embedding_model: openai/text-embedding-3-small # always used, regardless of provider_mode -- there is no local embedding path. OPENROUTER_API_KEY is required even under fully_local. Changing this needs a full reset + re-ingest -- see DECISIONS.md
  cloud_max_tokens: 4096 # response token cap for cloud calls; unset defaults to the model's own max, which can exceed the account's remaining credit balance

ingestion:
  schedule: "0 23 * * *" # cron expression; default 11 PM daily
  batch_metadata_group_size: 10 # items grouped per metadata-extraction LLM call

filters:
  min_content_length: 20 # chars; items shorter than this after extraction are dropped as noise
  browser_history:
    min_visit_count: 2
    domain_blocklist:
      - google.com/search
      - facebook.com
      - instagram.com
      - x.com
  gmail:
    excluded_labels:
      - CATEGORY_PROMOTIONS
      - CATEGORY_SOCIAL
  calendar:
    skip_recurring_without_description: true

chunking:
  target_chunk_size_tokens: 400
  chunk_overlap_tokens: 40

retrieval:
  top_k_vector: 8
  top_k_keyword: 8
  relationship_candidate_count: 10
  relationship_confidence_threshold: 0.6 # confirmed relationships below this confidence are discarded
  relationship_candidate_max_distance: 0.6 # candidates farther than this (cosine distance) never reach the LLM; null disables the filter
