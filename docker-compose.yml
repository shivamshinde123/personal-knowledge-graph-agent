# Docker Compose packaging for the Personal Knowledge Graph Agent --
# issue #52. Gets the whole stack (backend, frontend, Neo4j, Ollama,
# scheduler) running persistently with one command, replacing the manual
# developer setup (uv sync, npm install, installing/running Neo4j and
# Ollama by hand, registering a cron/Task Scheduler entry) for an end user.
#
# Setup: copy .env.docker.example to .env (this file, at the repo root --
# distinct from config/.env, the application's own config) and fill in at
# least NEO4J_PASSWORD, then `docker compose up -d`. See README.md's
# Docker section for the full walkthrough.
#
# What this does NOT do yet: guide a first-run user through connecting
# sources (API keys, Gmail/Calendar OAuth) -- that's issue #92, deliberately
# scoped out of this round. Until then, config/.env still needs filling in
# by hand the same way a manual dev setup does, then mounted in below.

services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
    ports:
      - "${HOST_NEO4J_HTTP_PORT:-7474}:7474"
      - "${HOST_NEO4J_BOLT_PORT:-7687}:7687"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Only started when the "local-llm" profile is active
  # (`docker compose --profile local-llm up -d`, or COMPOSE_PROFILES=local-llm
  # in .env) -- skipped entirely under provider_mode: fully_cloud, since
  # nothing else in the stack needs it then. See DECISIONS.md.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${HOST_OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped
    profiles: ["local-llm"]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      # Overrides config/.env's own values for anything that must point
      # inside this container/network rather than at the host -- real
      # process env vars set here take priority over the mounted .env
      # file's values (pydantic-settings' own precedence order). See
      # DECISIONS.md.
      #
      # LOCAL_FILES_WATCH_DIRS, BROWSER_HISTORY_PATH, every credential,
      # and everything else config/.env holds are deliberately NOT
      # overridden here -- they need to stay writable through the normal
      # config/.env path (PUT /api/settings/sources, POST
      # /api/setup/credentials, etc.), so the Settings/wizard's writes
      # actually take effect. config/settings.py defaults
      # LOCAL_FILES_WATCH_DIRS to the whole /data/watched mount when unset
      # under Docker, so the out-of-the-box behavior is unchanged.
      RUNNING_IN_DOCKER: "true"
      SQLITE_DB_PATH: /app/data/pkg_agent.db
      CHROMA_PERSIST_DIR: /app/data/chroma
      NEO4J_URI: bolt://neo4j:7687
      OLLAMA_HOST: http://ollama:11434
      FASTAPI_PORT: 8080
    volumes:
      - app_data:/app/data
      # A real bind mount of the whole config/ directory, not `env_file:`
      # and not a single-file mount of just .env -- both were tried and
      # verified directly to fail:
      #   - `env_file:` injects every key from config/.env as a real OS
      #     environment variable, frozen at container-start, which then
      #     *always* wins over anything later written to config/.env on
      #     disk (pydantic-settings' env-var-over-dotenv-file precedence)
      #     -- every runtime write this app makes to its own config
      #     (local files, browser history, credentials, Google OAuth)
      #     was silently ignored under Docker.
      #   - Bind-mounting only `./config/.env:/app/config/.env` fixed
      #     that, but broke the write itself: python-dotenv's set_key()
      #     writes via a temp file in the same directory, then
      #     `os.replace()` (an atomic rename) onto the target -- which
      #     requires source and destination on the same mount point.
      #     Mounting only the single file puts it on a different mount
      #     than its own parent directory (the container's own image
      #     layer), so the rename fails with "Device or resource busy".
      #     Mounting the whole directory puts the temp file and the
      #     target on the same mount, fixing this. config.yaml/settings.py/
      #     __init__.py are also files in this directory and get
      #     shadowed by the host's copies this way -- harmless, since
      #     they're the exact files the image was just built from.
      #     config/client_secret_*.json (if present, from the older
      #     manual Gmail/Calendar OAuth setup) becomes reachable inside
      #     the container too -- unlike baking a secret into a
      #     distributed image layer (the .dockerignore fix elsewhere in
      #     this file guards against that), a bind mount only exposes it
      #     to this same local machine's own container, not to anyone
      #     else. See DECISIONS.md.
      - ./config:/app/config
      - ${HOST_WATCH_DIR:-./docker/empty}:/data/watched:ro
      - ${HOST_DATA_DIR:-./docker/empty}:/host-data:ro
    ports:
      - "${HOST_BACKEND_PORT:-8080}:8080"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # Runs the exact same image as `backend`, just a different command --
  # see docker/backend.Dockerfile's own comment. Replaces "register a
  # cron/Task Scheduler entry by hand" entirely (scheduler/loop.py).
  scheduler:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "scheduler.loop"]
    environment:
      # See the backend service's own comment above -- everything except
      # these explicit overrides stays live-writable via config/.env.
      RUNNING_IN_DOCKER: "true"
      SQLITE_DB_PATH: /app/data/pkg_agent.db
      CHROMA_PERSIST_DIR: /app/data/chroma
      NEO4J_URI: bolt://neo4j:7687
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - app_data:/app/data
      # Same real bind mount as backend's own -- see its comment above.
      - ./config:/app/config
      - ${HOST_WATCH_DIR:-./docker/empty}:/data/watched:ro
      - ${HOST_DATA_DIR:-./docker/empty}:/host-data:ro
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        # The *published* host port -- the browser (on the host, not the
        # Docker network) is what calls this URL, so it must match
        # whatever HOST_BACKEND_PORT actually publishes below.
        VITE_API_BASE_URL: http://localhost:${HOST_BACKEND_PORT:-8080}/api
    ports:
      - "${HOST_FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # SQLite db + Chroma persist dir, both under one volume (matches the
  # single `data/` directory a manual dev setup already uses).
  app_data:
  neo4j_data:
  ollama_data:
