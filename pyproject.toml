[project]
name = "pkg-agent"
version = "0.1.0"
description = "Personal Knowledge Graph Agent — a fully local, privacy-first system that ingests personal data from six sources and answers natural language questions about it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.199.0",
    "google-auth>=2.57.0",
    "google-auth-oauthlib>=1.4.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langsmith>=0.11.1",
    "neo4j>=6.2.0",
    "notion-client>=3.1.0",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.52.3",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, N: pep8-naming,
# D: pydocstyle (Google style), UP: pyupgrade, B: bugbear.
select = ["E", "W", "F", "I", "N", "D", "UP", "B"]
ignore = [
    "D203", # conflicts with D211 (no blank line before class docstring)
    "D213", # conflicts with D212 (summary on first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are self-documenting via their names; don't require docstrings there.
# D107/N802/N803 also ignored for tests specifically: a fake test double for
# an external API (e.g. Gmail/Calendar's Python client, which preserves the
# REST API's own camelCase parameter names like userId/calendarId/getProfile
# verbatim rather than translating to snake_case) must match that real
# API's method and parameter names exactly to be a faithful fake -- see
# tests/test_extractors/test_gmail.py and test_calendar.py.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D107", "N802", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Top-level packages (storage/, pipeline/, ...) are imported from the repo root.
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
